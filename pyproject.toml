[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninova-mcp"
version = "0.2.0"
description = "Credential-based MCP server for ITU Ninova and OBS: courses, announcements, files, assignments, grades, transcript, graduation progress, course-registration planning with prerequisites and schedule-conflict checks, and hocametre instructor ratings — from Claude, Cursor, Codex, and other MCP clients."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hikmet Gultekin" },
]
keywords = ["mcp", "model-context-protocol", "ninova", "obs", "itu", "course-registration", "hocametre", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "mcp>=1.27.0,<2",
  "requests>=2.31.0",
  "starlette>=0.37.2",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/hikmedit/ninova-mcp"
Repository = "https://github.com/hikmedit/ninova-mcp"
Issues = "https://github.com/hikmedit/ninova-mcp/issues"

[project.scripts]
ninova-mcp = "ninova_mcp.server:main"
ninova-mcp-remote = "ninova_mcp.remote:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
