[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninova-mcp"
version = "0.1.0"
description = "Credential-based MCP server for browsing and downloading content from ITU Ninova."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "mcp>=1.27.0,<2",
  "requests>=2.31.0",
  "starlette>=0.37.2",
  "uvicorn>=0.30.0",
]

[project.scripts]
ninova-mcp = "ninova_mcp.server:main"
ninova-mcp-remote = "ninova_mcp.remote:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
